name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iagora
          POSTGRES_PASSWORD: iagora
          POSTGRES_DB: iagora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iagora" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DSN: postgresql+asyncpg://iagora:iagora@localhost:5432/iagora
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migrations (upgrade, puis vérification qu'aucun modèle n'est hors migration)
        run: alembic upgrade head && alembic check
      - name: Tests (base PostgreSQL dédiée, distincte de la base migrée)
        env:
          PGPASSWORD: iagora
          TEST_DATABASE_URL: postgresql+asyncpg://iagora:iagora@localhost:5432/iagora_test
        run: |
          psql -h localhost -U iagora -d iagora -c "CREATE DATABASE iagora_test"
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend

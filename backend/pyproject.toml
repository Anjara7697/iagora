[project]
name = "iagora-backend"
version = "0.1.0"
description = "Agent Intelligent Commercial 2.0 - backend (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Outils de recette : textes français longs, assertions de garde, aucune exécution en production.
"app/devtools/**" = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
# Fournisseur optionnel (pip install langchain-openai), absent de requirements.txt.
module = "langchain_openai"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/**/__init__.py"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Objectif CdC NF-07 : >= 70 % sur le backend critique du MVP
fail_under = 70

# Mises à jour des dépendances (AUDIT-OPS-004, décision D-31) : une PR groupée par écosystème, le
# 1er de chaque mois, vers dev. Les versions majeures sont ignorées : elles cassent souvent quelque
# chose et se décident à la main. Les failles connues restent signalées par la tâche CI « audit ».
# Chaque PR passe la CI complète et se relit comme les autres ; rien n'est mergé automatiquement.
# Python : les versions figées (requirements*.lock.txt) sont générées par scripts/lock-deps.sh ;
# si l'étape « Versions figées à jour » échoue sur une PR Dependabot, relancer le script sur la
# branche de la PR plutôt que de corriger le fichier à la main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

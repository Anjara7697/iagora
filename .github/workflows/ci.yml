name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iagora
          POSTGRES_PASSWORD: iagora
          POSTGRES_DB: iagora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iagora" --health-interval 5s
          --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        # --health-cmd passe par `sh -c` : pas de parenthèses ni de guillemets dans la commande.
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgresql+asyncpg://iagora:iagora@localhost:5432/iagora
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - run: pip install -r requirements-dev.lock.txt
      - name: Versions figées à jour (scripts/lock-deps.sh)
        run: pip install uv && scripts/lock-deps.sh && git diff --exit-code requirements.lock.txt requirements-dev.lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migrations (upgrade, puis vérification qu'aucun modèle n'est hors migration)
        run: alembic upgrade head && alembic check
      - name: Retour arrière des migrations (descente complète puis remontée)
        run: alembic downgrade base && alembic upgrade head && alembic check
      - name: Contrat OpenAPI à jour (scripts/export_openapi.py)
        run: python scripts/export_openapi.py --check
      - name: Tests (PostgreSQL dédiée, distincte de la base migrée, et MongoDB réel)
        env:
          PGPASSWORD: iagora
          TEST_DATABASE_URL: postgresql+asyncpg://iagora:iagora@localhost:5432/iagora_test
          TEST_MONGO_URI: mongodb://localhost:27017
        run: |
          psql -h localhost -U iagora -d iagora -c "CREATE DATABASE iagora_test"
          pytest

  frontend:
    runs-on: ubuntu-latest
    # Image officielle de Playwright (même version que @playwright/test dans package-lock.json) :
    # navigateurs et dépendances système déjà installés, aucun téléchargement depuis les dépôts
    # Ubuntu à chaque passage (une panne de ces dépôts bloquait la CI). À mettre à jour avec Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Contrat du workflow n8n (hors ligne)
        working-directory: .
        run: node tools/n8n/build.mjs --check && node --test tools/n8n/prospect.test.mjs
      - run: npm ci
      - run: npm run lint
      - name: Types de l'API à jour (src/lib/api/schema.d.ts)
        run: npm run api:check
      - run: npm run typecheck
      - name: Tests unitaires (fonctions pures de src/lib, Node seul)
        run: npm run test:unit
      # Build d'abord : les tests navigateur tournent sur la version de production (pages compilées une fois).
      - run: npm run build
      - name: Tests navigateur (API simulée, version de production)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "1"
      # En cas d'échec, captures obtenues, attendues et différences (tests/visuel.spec.ts) à télécharger.
      - name: Résultats des tests navigateur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  audit:
    # Failles connues des dépendances (AUDIT-OPS-004) : signalées en avertissement, sans bloquer la CI
    # pour l'instant. Les versions analysées sont celles qui partent en production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt --disable-pip --no-deps --progress-spinner off \
            || echo "::warning title=pip-audit::Failles connues dans backend/requirements.lock.txt (voir le journal)"
      - name: Dépendances npm de production (npm audit)
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high \
            || echo "::warning title=npm audit::Failles connues dans les dépendances de production (voir le journal)"

  e2e-api:
    # Parcours navigateur contre le VRAI backend (AUDIT-QA-001) : API réelle, PostgreSQL et MongoDB
    # réels, console construite vers cette API. Aucune donnée réelle : base de test jetable.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iagora
          POSTGRES_PASSWORD: iagora
          POSTGRES_DB: iagora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iagora" --health-interval 5s
          --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgresql+asyncpg://iagora:iagora@localhost:5432/iagora
      MONGO_URI: mongodb://localhost:27017
      ENVIRONMENT: development
      REDIS_URL: ""
      AGENT_AUTO_REPLY: "false"
      FOLLOW_UP_WORKER_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:3100","http://127.0.0.1:3100"]'
      # Compte de test de cette base jetable, recréé à chaque passage : pas un secret.
      E2E_ADMIN_USER: e2e-admin
      E2E_ADMIN_PASSWORD: E2e-Compte-de-test-CI-1
      E2E_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: API réelle (migrations, compte de test, démarrage)
        working-directory: backend
        run: |
          pip install -r requirements.lock.txt
          alembic upgrade head
          ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" python -m app.cli create-admin --username "$E2E_ADMIN_USER" --email e2e-admin@demo.example.com
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ready && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Console construite vers l'API réelle
        working-directory: frontend
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      - name: Parcours contre le vrai backend (Chrome du runner, aucun téléchargement)
        working-directory: frontend
        run: npx playwright test -c playwright.api.config.ts --trace off
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - name: Image de la console
        run: |
          docker build ./frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api/v1 \
            --build-arg NEXT_PUBLIC_ENABLE_SIMULATOR=false
      - name: Pile de production (validation de la configuration)
        run: |
          cp deploy/.env.production.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MONGO_PASSWORD=$/MONGO_PASSWORD=ci/' deploy/.env
          docker compose -f deploy/compose.prod.yml --env-file deploy/.env config --quiet
